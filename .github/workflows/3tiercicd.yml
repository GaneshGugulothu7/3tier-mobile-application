name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'infra/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod
      run_apply:
        description: 'Run terraform apply?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  TF_VERSION: "1.7.5"
  TF_WORKING_DIR: "./infra"
  BACKEND_RG: "rg-tfstate"
  BACKEND_SA: "stterraformstate001"
  BACKEND_CONTAINER: "tfstate"

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1 – Lint & Security Scan
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  lint:
    name: "Lint & Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --version

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2 – Terraform Plan (dev)
# ═══════════════════════════════════════════════════════════════════════════════
  plan-dev:
    name: "Plan – dev"
    runs-on: ubuntu-latest
    needs: lint
    environment: dev
    env:
      TF_ENV: dev

    permissions:
      id-token: write       # required for OIDC
      contents: read
      pull-requests: write  # to post plan output as PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID_DEV }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ env.BACKEND_SA }}" \
            -backend-config="container_name=${{ env.BACKEND_CONTAINER }}" \
            -backend-config="key=${{ env.TF_ENV }}.terraform.tfstate" \
            -input=false
        env:
          ARM_USE_OIDC:        true
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID_DEV }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="${{ env.TF_ENV }}.tfvars" \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="apim_publisher_email=${{ secrets.APIM_PUBLISHER_EMAIL }}" \
            -out=tfplan-${{ env.TF_ENV }} \
            -input=false \
            -no-color 2>&1 | tee plan-output.txt
        env:
          ARM_USE_OIDC:        true
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID_DEV }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

      - name: Post Plan as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan – \`dev\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_WORKING_DIR }}/tfplan-dev
          retention-days: 5

# ═══════════════════════════════════════════════════════════════════════════════
