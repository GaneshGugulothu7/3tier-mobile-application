# ═══════════════════════════════════════════════════════════════════════════════
# JOB 4 – Terraform Plan (prod)
# ═══════════════════════════════════════════════════════════════════════════════
  plan-prod:
    name: "Plan – prod"
    runs-on: ubuntu-latest
    needs: lint
    environment: prod
    env:
      TF_ENV: prod

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ env.BACKEND_SA }}" \
            -backend-config="container_name=${{ env.BACKEND_CONTAINER }}" \
            -backend-config="key=${{ env.TF_ENV }}.terraform.tfstate" \
            -input=false
        env:
          ARM_USE_OIDC:        true
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID_PROD }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="${{ env.TF_ENV }}.tfvars" \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="apim_publisher_email=${{ secrets.APIM_PUBLISHER_EMAIL }}" \
            -out=tfplan-${{ env.TF_ENV }} \
            -input=false \
            -no-color
        env:
          ARM_USE_OIDC:        true
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID_PROD }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
