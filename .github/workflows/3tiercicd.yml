trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - infra/**

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - infra/**

variables:
  - group: terraform-global
  - name: TF_VERSION
    value: "1.7.5"
  - name: TF_WORKING_DIR
    value: "$(System.DefaultWorkingDirectory)/infra"
  - name: BACKEND_RG
    value: "rg-tfstate"
  - name: BACKEND_SA
    value: "stterraformstate001"
  - name: BACKEND_CONTAINER
    value: "tfstate"

parameters:
  - name: runProd
    type: boolean
    default: false

stages:

# ─────────────────────────────────────────────
# CI STAGE
# ─────────────────────────────────────────────
- stage: CI
  jobs:

  # LINT + SECURITY
  - job: Lint
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - task: TerraformInstaller@1
        inputs:
          terraformVersion: $(TF_VERSION)

      - script: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          cd $(TF_WORKING_DIR)
          tflint --init
          tflint --recursive

      - script: |
          pip3 install checkov --quiet
          checkov -d $(TF_WORKING_DIR) \
            --framework terraform \
            --output junitxml \
            --output-file-path $(Build.ArtifactStagingDirectory)/checkov.xml \
            --soft-fail

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: "$(Build.ArtifactStagingDirectory)/checkov.xml"

  # PLAN JOB TEMPLATE INLINE
  - job: Plan_Dev
    dependsOn: Lint
    variables:
      - group: terraform-dev
      - name: TF_ENV
        value: dev
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - task: TerraformInstaller@1
        inputs:
          terraformVersion: $(TF_VERSION)

      - task: AzureKeyVault@2
        inputs:
          azureSubscription: "sc-azure-dev"
          KeyVaultName: "kv-dev-myapp-xxxx"
          SecretsFilter: "subscription-id,tenant-id,apim-publisher-email"

      - task: TerraformTaskV4@4
        inputs:
          provider: azurerm
          command: init
          workingDirectory: $(TF_WORKING_DIR)
          backendServiceArm: "sc-azure-dev"
          backendAzureRmResourceGroupName: $(BACKEND_RG)
          backendAzureRmStorageAccountName: $(BACKEND_SA)
          backendAzureRmContainerName: $(BACKEND_CONTAINER)
          backendAzureRmKey: "dev.terraform.tfstate"

      - task: TerraformTaskV4@4
        inputs:
          provider: azurerm
          command: plan
          workingDirectory: $(TF_WORKING_DIR)
          environmentServiceNameAzureRM: "sc-azure-dev"
          commandOptions: >-
            -var="environment=dev"
            -var-file="dev.tfvars"
            -out=$(Build.ArtifactStagingDirectory)/tfplan-dev

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/tfplan-dev"
          artifact: "tfplan-dev"

# ─────────────────────────────────────────────
# APPLY DEV
# ─────────────────────────────────────────────
- stage: Deploy_Dev
  dependsOn: CI
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Apply_Dev
    environment: dev
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: TerraformInstaller@1
              inputs:
                terraformVersion: $(TF_VERSION)

            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: "tfplan-dev"
                targetPath: "$(Pipeline.Workspace)/tfplan-dev"

            - task: TerraformTaskV4@4
              inputs:
                provider: azurerm
                command: init
                workingDirectory: $(TF_WORKING_DIR)
                backendServiceArm: "sc-azure-dev"
                backendAzureRmResourceGroupName: $(BACKEND_RG)
                backendAzureRmStorageAccountName: $(BACKEND_SA)
                backendAzureRmContainerName: $(BACKEND_CONTAINER)
                backendAzureRmKey: "dev.terraform.tfstate"

            - task: TerraformTaskV4@4
              inputs:
                provider: azurerm
                command: apply
                workingDirectory: $(TF_WORKING_DIR)
                environmentServiceNameAzureRM: "sc-azure-dev"
                commandOptions: >-
                  -auto-approve
                  $(Pipeline.Workspace)/tfplan-dev/tfplan-dev

# ─────────────────────────────────────────────
# APPLY TEST
# ─────────────────────────────────────────────
- stage: Deploy_Test
  dependsOn: Deploy_Dev
  jobs:
  - deployment: Apply_Test
    environment: test
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: TerraformInstaller@1
              inputs:
                terraformVersion: $(TF_VERSION)

            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: "tfplan-test"
                targetPath: "$(Pipeline.Workspace)/tfplan-test"

# ─────────────────────────────────────────────
# APPLY PROD
# ─────────────────────────────────────────────
- stage: Deploy_Prod
  dependsOn: Deploy_Test
  condition: eq('${{ parameters.runProd }}', true)
  jobs:
  - deployment: Apply_Prod
    environment: prod
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self