        env:
          ARM_USE_OIDC:        true
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID_TEST }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
